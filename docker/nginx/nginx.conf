load_module modules/ngx_http_perl_module.so;
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;
  # правило R4: главните букви се нормализират до малки
  perl_set $uri_lc 'sub { return lc($_[0]->uri) }';
  # матрицата на пренасочванията (план, стр. 14) — генерира се от scripts/build-redirects.mjs
  # Кофите трябва да поемат най-дългия ключ (64 знака, напр.
  # /en/mercedes-benz/amg-gt-coupe-roadster-997/2017-0/18110/14868), закръглено нагоре
  # до кратно на размера на кеш-реда. Без това nginx пада с
  # „could not build map_hash, you should increase map_hash_bucket_size: 64“.
  map_hash_bucket_size 128;
  map_hash_max_size 32768;
  map $uri $redir {
    default "";
    include /etc/nginx/redirects.map;
  }
  # ── Кой хост вижда НОВИЯ сайт ─────────────────────────────────────────────
  #
  # Новият сайт (Cloudflare Pages, проект `new-pdk`) трябва да се вижда на
  # new.pdktuning.com. Правилният път е CNAME натам, но зоната не е в нашия
  # акаунт и записът чака IT-то на клиента; дотук на този адрес се показваше
  # сайтът с 30 885 страници от изнесения каталог.
  #
  # Проверката НЕ Е по `server_name new.pdktuning.com`. Първият опит беше
  # такъв и не се задейства: пред контейнера стои прокси и `Host`, който
  # стига дотук, не е името от адресната лента. Затова логиката е обърната —
  # изброени са хостовете, които ОСТАВАТ при стария сайт, а всичко друго
  # отива към новия. Така правилото не зависи от това какво пише проксито.
  #
  # `localhost` и `127.0.0.1` НЕ СА изключени, макар health check-ът да идва
  # точно оттам. Мерено: проксито отпред праща `Host: localhost`, тоест по
  # това име НЕ МОГАТ да се различат реалният посетител и проверката —
  # изключването им връщаше всичко обратно на стария сайт.
  # Проверката вместо това има свой път `/__alive`, който стои преди
  # условието и никога не излиза навън.
  map $host $to_new_site {
    default             1;
    "www.pdktuning.com" 0;
    "pdktuning.com"     0;
  }

  # Два пътя ОСТАВАТ местни, каквото и да е името на хоста: проверката дали
  # контейнерът е жив и формата. `if` на ниво server се изпълнява в rewrite
  # фазата, ПРЕДИ избора на location — тоест отделен `location = /__alive`
  # нямаше да го спаси, колкото и нагоре да стои.
  map $request_uri $keep_local {
    default       "";
    "~^/__alive$" "1";
    "~^/api/"     "1";
  }

  # Indexing is DENIED unless the host is the real production domain. Inverted on
  # purpose: keying noindex to the staging name failed silently, because the proxy
  # in front does not pass Host through as new.pdktuning.com. Defaulting to noindex
  # means an unexpected Host costs us a missing crawl, not 30,885 duplicate pages
  # competing with the live site (every canonical points at www.pdktuning.com).
  # An empty value adds NO header at all, so production stays untouched.
  map $host $robots_tag {
    default "noindex, nofollow";
    "www.pdktuning.com" "";
    "pdktuning.com" "";
  }
  include /etc/nginx/conf.d/*.conf;
}
