# Локално: docker compose up -d --build  →  http://localhost:8000
# На сървъра: само готови имиджи чрез deploy.yml (виж README.md).
# Променливите се четат от .env до този файл (виж .env.example).
services:
  web:
    build:
      context: .
      args:
        BASE_URL: ${BASE_URL:-https://new.pdktuning.com}
        CATALOG_BASE_URL: ${CATALOG_BASE_URL:-https://www.pdktuning.com}
        PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
        PUBLIC_GA_ID: ${PUBLIC_GA_ID:-}
        PUBLIC_GSC_VERIFY: ${PUBLIC_GSC_VERIFY:-}
    ports:
      - "8000:80"
    environment:
      BASE_URL: ${BASE_URL:-https://new.pdktuning.com}
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:-https://www.pdktuning.com}
      PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO: ${CONTACT_TO:-${MAIL_TO:-}}
      CONTACT_FROM: ${CONTACT_FROM:-${MAIL_FROM:-}}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      - api
    restart: always
  api:
    build: ./api
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-PDK Tuning <noreply@pdktuning.com>}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_CC: ${MAIL_CC:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    restart: always
