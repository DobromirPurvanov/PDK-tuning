# Locally: docker compose up -d --build  ->  http://localhost:8000
# On the server: only prebuilt images via deploy.yml (see README.md).
# Variables are read from the .env next to this file (see .env.example).
services:
  web:
    build:
      context: .
      args:
        PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
        PUBLIC_GA_ID: ${PUBLIC_GA_ID:-}
        PUBLIC_GSC_VERIFY: ${PUBLIC_GSC_VERIFY:-}
    ports:
      - "8000:80"
    environment:
      PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO: ${CONTACT_TO:-${MAIL_TO:-}}
      CONTACT_FROM: ${CONTACT_FROM:-${MAIL_FROM:-}}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      - api
    restart: always
  api:
    build: ./api
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-PDK Tuning <noreply@pdktuning.com>}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_CC: ${MAIL_CC:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    restart: always
