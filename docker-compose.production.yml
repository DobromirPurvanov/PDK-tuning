# Production: prebuilt images only. See README.md.
services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    ports:
      - "8000:80"
    environment:
      BASE_URL: ${BASE_URL:-https://new.pdktuning.com}
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:-https://www.pdktuning.com}
      PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO: ${CONTACT_TO:-${MAIL_TO:-}}
      CONTACT_FROM: ${CONTACT_FROM:-${MAIL_FROM:-}}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      - api
    restart: always
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-PDK Tuning <noreply@pdktuning.com>}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_CC: ${MAIL_CC:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    restart: always
