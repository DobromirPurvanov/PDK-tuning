name: Deploy PDK Chip Tuning Website

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Tagged Code
        uses: actions/checkout@v4

      - name: Copy files to server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }} # <-- Added Port
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/pdk_new/website"
          
      - name: Build and start containers via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }} # <-- Added Port
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Билдът на 30 885 страници е ~285 s на тази машина, плюс npm ci.
          command_timeout: 20m
          script: |
            set -e
            cd /home/pdk_new/website
            # Тайните живеят САМО на сървъра (.env* са в .gitignore и не се качват).
            # --env-file важи и за заместването на ${...}, значи и за build args.
            # env_file: в compose файла НЕ върши тази работа — той е само по време
            # на работа, а PUBLIC_TURNSTILE_SITEKEY се зашива в HTML-а при билда.
            # if, а не [ ] && — при set -e неуспешният тест би убил скрипта.
            EF=""
            if [ -f .env ]; then EF="$EF --env-file .env"; fi
            if [ -f .env.local ]; then EF="$EF --env-file .env.local"; fi
            if [ -z "$EF" ]; then echo "няма нито .env, нито .env.local до docker-compose.yml"; exit 1; fi
            echo "променливите се четат от:$EF"
            # Без това нищо не тръгва: копирането на файлове не вдига контейнери.
            docker compose $EF build
            # Счупен nginx.conf се хваща ПРЕДИ работещите контейнери да бъдат сменени.
            docker compose $EF run --rm --no-deps web nginx -t
            docker compose $EF up -d --remove-orphans
            docker compose $EF ps
            # Порт 8000 трябва да отговаря, иначе прокситo пред него дава 502.
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:8000/bg/ && break
              [ "$i" = 30 ] && { docker compose logs --tail=50; exit 1; }
              sleep 2
            done
            echo "Successfully deployed PDK Chip Tuning Website - tag ${{ github.ref_name }}!"
