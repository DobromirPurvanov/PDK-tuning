name: Deploy PDK Chip Tuning Website

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Tagged Code
        uses: actions/checkout@v4

      - name: Copy files to server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }} # <-- Added Port
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/pdk_new/website"
          
      - name: Build and start containers via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }} # <-- Added Port
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Building 30,885 pages takes ~285s on this box, plus npm ci.
          command_timeout: 20m
          script: |
            set -e
            cd /home/pdk_new/website
            # Secrets live ONLY on the server (.env* are gitignored, never shipped).
            # --env-file also feeds ${...} interpolation, so it covers build args.
            # env_file: in the compose file does NOT: it is runtime-only, while
            # PUBLIC_TURNSTILE_SITEKEY is baked into the HTML at build time.
            # Using if, not [ ] && — under set -e a failing test would kill the script.
            EF=""
            if [ -f .env ]; then EF="$EF --env-file .env"; fi
            if [ -f .env.local ]; then EF="$EF --env-file .env.local"; fi
            if [ -z "$EF" ]; then echo "no .env or .env.local next to docker-compose.yml"; exit 1; fi
            echo "reading variables from:$EF"
            # Without this nothing starts: copying files does not create containers.
            docker compose $EF build
            # Catch a broken nginx.conf BEFORE the running containers are replaced.
            # No --no-deps here: nginx resolves proxy_pass http://api:3000 at config
            # load time, so the api container must be up or the test dies with
            # "host not found in upstream".
            docker compose $EF run --rm web nginx -t
            docker compose $EF up -d --remove-orphans
            docker compose $EF ps
            # Port 8000 must answer, otherwise the proxy in front of it returns 502.
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:8000/bg/ && break
              [ "$i" = 30 ] && { docker compose $EF logs --tail=50; exit 1; }
              sleep 2
            done
            echo "Successfully deployed PDK Chip Tuning Website - tag ${{ github.ref_name }}!"
