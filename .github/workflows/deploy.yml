name: Deploy PDK Chip Tuning Website

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pdk-images-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_IMAGE: pdk-tuning-web:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      API_IMAGE: pdk-tuning-api:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      PUBLIC_GSC_VERIFY: ${{ vars.PUBLIC_GSC_VERIFY }}
      RELEASE: releases/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Пълната история е нужна за пакета, с който сървърът си оправя гита.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install new site dependencies
        run: npm ci --prefix site --no-audit --no-fund

      - name: New site runtime tests
        run: node --test site/server/*.test.mjs

      - name: API tests
        run: npm test --prefix api

      - name: Deployment regression tests
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py' -v

      # Read only public build settings. Secrets stay on VPS.
      - name: Read public build configuration and check architecture
        if: startsWith(github.ref, 'refs/tags/v')
        id: public-config
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          capture_stdout: true
          script: |
            set -eu
            test "$(uname -m)" = x86_64 || { echo 'Expected amd64 server' >&2; exit 1; }
            cd /home/pdk_new/website
            set --
            if [ -f .env ]; then set -- "$@" --env-file .env; fi
            if [ -f .env.local ]; then set -- "$@" --env-file .env.local; fi
            test "$#" -gt 0 || { echo 'Missing .env or .env.local' >&2; exit 1; }
            echo PDK_PUBLIC_CONFIG_BEGIN
            docker compose "$@" -f - config --format json <<'CONFIG'
            services:
              config:
                image: scratch
                environment:
                  PUBLIC_INDEXABLE: ${PUBLIC_INDEXABLE:-false}
                  PUBLIC_GA_ID: ${PUBLIC_GA_ID:-}
                  PUBLIC_GSC_VERIFY: ${PUBLIC_GSC_VERIFY:-}
            CONFIG
            echo PDK_PUBLIC_CONFIG_END

      - name: Prepare build arguments
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PUBLIC_CONFIG: ${{ steps.public-config.outputs.stdout }}
        run: python3 scripts/deploy/public-config.py

      - uses: docker/setup-buildx-action@v4

      - name: Build web image on GitHub runner
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            PUBLIC_INDEXABLE=${{ env.PUBLIC_INDEXABLE }}
            PUBLIC_GA_ID=${{ env.PUBLIC_GA_ID }}
            PUBLIC_GSC_VERIFY=${{ env.PUBLIC_GSC_VERIFY }}
            SITE_RELEASE=${{ github.sha }}
            SITE_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=pdk-web
          cache-to: type=gha,mode=max,scope=pdk-web

      - name: Build API image on GitHub runner
        uses: docker/build-push-action@v7
        with:
          context: ./api
          platforms: linux/amd64
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=pdk-api
          cache-to: type=gha,mode=max,scope=pdk-api

      - name: Verify images on GitHub runner
        run: |
          docker compose -p pdk-ci -f docker-compose.production.yml up -d --no-build --pull never api
          docker compose -p pdk-ci -f docker-compose.production.yml run --rm --no-deps --pull never web node server/server.mjs --check
          docker compose -p pdk-ci -f docker-compose.production.yml up -d --no-build --pull never web api
          for i in $(seq 1 30); do
            if curl --connect-timeout 3 --max-time 5 -fsS -o /dev/null http://127.0.0.1:8000/__alive && curl --connect-timeout 3 --max-time 5 -fsS -o /dev/null http://127.0.0.1:8000/api/health; then node scripts/deploy/check-site.mjs http://127.0.0.1:8000; exit $?; fi
            sleep 2
          done
          docker compose -p pdk-ci -f docker-compose.production.yml logs --tail=50
          exit 1

      - name: Package prebuilt images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RELEASE"
          docker save --output "$RELEASE/images.tar" "$WEB_IMAGE" "$API_IMAGE"
          (cd "$RELEASE" && sha256sum images.tar > images.tar.sha256)
          printf 'WEB_IMAGE=%s\nAPI_IMAGE=%s\n' "$WEB_IMAGE" "$API_IMAGE" > "$RELEASE/images.env"
          cp docker-compose.production.yml "$RELEASE/docker-compose.yml"
          cp scripts/deploy/activate.sh "$RELEASE/activate.sh"
          # Сървърът е с HTTPS origin и без креденшъли за частното хранилище,
          # затова историята пътува с деплоя вместо да се тегли оттам.
          git bundle create "$RELEASE/repo.bundle" --all

      - name: Transfer only prebuilt images and runtime configuration
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.RELEASE }}
          target: /home/pdk_new/website
          timeout: 120s
          command_timeout: 10m

      - name: Load images and update only web and API
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE: ${{ env.RELEASE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELEASE
          command_timeout: 10m
          script: |
            set -eu
            cd /home/pdk_new/website
            bash "$RELEASE/activate.sh" "$RELEASE"

      # Кодът пътува в Docker образите, не с `git checkout`, затова работното
      # дърво на сървъра оставаше заковано на тага, с който е клонирано, и
      # всеки, който влезеше там, четеше стара версия при нов дизайн. Тази
      # стъпка е след здравата проверка: сайтът вече работи, тук се оправя само
      # какво показва сървърът. Затова тя не вали деплоя, ако не успее.
      - name: Point the server working tree at the deployed tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/ssh-action@v1.2.2
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RELEASE: ${{ env.RELEASE }}
          SSH_URL: git@github.com:${{ github.repository }}.git
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,SHA,RELEASE,SSH_URL
          command_timeout: 5m
          script: |
            set -u
            cd /home/pdk_new/website
            printf '%s %s %s\n' "$TAG" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ACTIVE-VERSION
            echo "PDK_TREE_BEGIN"
            echo "преди: $(git describe --tags --always 2>&1)"
            # Untracked файлове (.env, releases/, .compose.active.yml) не се
            # пипат от checkout; следените са огледало на деплоя, не работно
            # място, затова --force е безопасен тук.
            if git fetch --force "$RELEASE/repo.bundle" "refs/tags/$TAG:refs/tags/$TAG" \
               && git checkout --detach --force "refs/tags/$TAG"; then
              echo "след: $(git describe --tags)"
            else
              echo "Дървото остава на стария таг; меродавен е ACTIVE-VERSION" >&2
            fi
            rm -f "$RELEASE/repo.bundle"
            # Деплоят не се нуждае от origin — кодът дойде с bundle-а. Това е
            # само за ръчното `git pull` на сървъра: ключът там не важи за
            # HTTPS адрес, затова адресът се сменя, но само ако ключът
            # наистина отваря GitHub. Няма ключ -> нищо не се пипа.
            export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10'
            if [ "$(git remote get-url origin)" != "$SSH_URL" ] \
               && git ls-remote --quiet "$SSH_URL" HEAD >/dev/null 2>&1; then
              git remote set-url origin "$SSH_URL"
              echo "origin мина на SSH"
            fi
            echo "origin: $(git remote get-url origin)"
            if git fetch --quiet --tags origin >/dev/null 2>&1; then
              echo "ръчният git pull работи"
            else
              echo "origin не се отваря от сървъра; деплоят пак минава с bundle-а"
            fi
            git status --porcelain | head -20
            echo "PDK_TREE_END"
            exit 0
