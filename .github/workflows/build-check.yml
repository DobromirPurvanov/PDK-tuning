# Портата за качеството. Тук се пускат SEO проверките от scripts/verify-build.mjs,
# а не в образа: така отказът се вижда преди деплой и не оставя сайта на 502.
# Пуска се на Linux — билдът на macOS минава, защото файловата система там не
# различава главни от малки букви.
name: Проверка на билда

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Astro билд
        run: npx astro build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: SEO проверки
        run: node scripts/verify-build.mjs
