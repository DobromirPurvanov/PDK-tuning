# The quality gate. The SEO checks from scripts/verify-build.mjs run here rather
# than inside the image, so a failure shows up before deploy instead of leaving
# the site on 502. Runs on Linux: a macOS build passes because that filesystem
# is case-insensitive.
name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Astro build
        run: npx astro build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: SEO checks
        run: node scripts/verify-build.mjs
