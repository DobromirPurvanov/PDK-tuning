name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://new.pdktuning.com
      CATALOG_BASE_URL: https://www.pdktuning.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site --no-audit --no-fund
      - run: node --test site/server/*.test.mjs
      - run: npm run check --prefix site
      - run: npm run build:etap1 --prefix site
      - run: npm test --prefix api
